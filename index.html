<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca endereço</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Buscar endereço pelo CEP</h1>
        <input id="cep" placeholder="CEP:">
        <button onclick="buscarEndereco()">Buscar endereço</button>
        <div id="resultado">
            <p> Rua: <span id="rua"></span></p>
            <p> Bairro: <span id="bairro"></span></p>
            <p> Cidade: <span id="cidade"></span></p>
            <p> Estado: <span id="estado"></span></p>
            <p> Região: <span id="regiao"></span></p>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
